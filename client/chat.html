<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="chat.title">Oxype Chat</title>
    <!-- Base Stylesheet and Style Controller Styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Chat Interface Specific Stylesheet -->
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="chat-app-layout">
        <!-- Sidebar: Conversation List & User Profile -->
        <aside class="chat-sidebar" id="chatSidebar">
            <!-- Sidebar Header with Top-Left Create Session Button -->
            <header class="sidebar-header">
                <!-- Create Session Button in Top-Left (Replaces Oxype branding) -->
                <button type="button" id="createSessionBtn" class="btn-create-session" data-i18n-title="chat.createSessionTitle" title="Create New Conversation" aria-label="Create New Conversation">
                    <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span data-i18n="chat.newSession">New Conversation</span>
                </button>
            </header>

            <!-- Conversations Section Title -->
            <div class="sidebar-section-title" data-i18n="chat.sessionsTitle">Conversations</div>

            <!-- Dynamic Session List (Rendered via core.getJoinedSessions, NO fake mock templates) -->
            <div class="session-list" id="sessionList" role="list">
                <!-- Dynamically populated or displays empty state -->
                <div class="empty-sessions-placeholder" id="emptySessionsPlaceholder">
                    <div class="empty-sessions-icon">
                        <svg class="icon-svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </div>
                    <div class="empty-sessions-text" data-i18n="chat.noSessions">No conversations joined yet</div>
                    <div class="empty-sessions-hint" data-i18n="chat.noSessionsHint">When you join or are added to sessions, they will appear here.</div>
                </div>
            </div>

            <!-- Sidebar User Profile Footer with Settings Button -->
            <footer class="sidebar-user-footer">
                <div class="user-profile-info">
                    <div class="user-avatar-sm" id="userAvatar">U</div>
                    <div class="user-meta-text">
                        <div class="user-display-name" id="userDisplayName">User</div>
                        <div class="user-id-badge" id="userIdBadge">ID: --</div>
                    </div>
                </div>
                <!-- Settings Button (Replaces Door Logout Icon) -->
                <button id="settingsBtn" class="settings-icon-btn" type="button" data-i18n-title="chat.settingsBtn" title="Settings" aria-label="Settings">
                    <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </footer>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main" id="chatMain">
            <!-- Active Conversation Header (No divider until session is active) -->
            <header class="chat-header" id="chatHeader">
                <div class="current-session-info">
                    <h2 class="current-session-title" id="currentSessionTitle"></h2>
                    <span class="current-session-id" id="currentSessionId" style="display: none;"></span>
                </div>
            </header>

            <!-- Messages Stream Area (Blank before clicking a chat) -->
            <section class="chat-messages-container" id="messagesContainer">
            </section>

            <!-- Message Input & Composer -->
            <footer class="chat-composer" id="chatComposer" style="display: none;">
                <input type="text" id="messageInput" class="chat-input" 
                       data-i18n-placeholder="chat.inputPlaceholder" 
                       placeholder="Type a message..." autocomplete="off">
                <button type="button" id="sendBtn" class="btn-primary btn-send" data-i18n-title="chat.sendBtn" title="Send" aria-label="Send">
                    <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span data-i18n="chat.sendBtn">Send</span>
                </button>
            </footer>
        </main>
    </div>

    <!-- Backdrop Overlay for Dialogs/Toasts -->
    <div id="dialogOverlay" class="dialog-overlay" style="display: none;"></div>

    <!-- Create Session Toast Dialog -->
    <div id="createSessionDialog" class="interactive-dialog" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="dialogCreateTitle">
        <header class="dialog-header">
            <h3 id="dialogCreateTitle" class="dialog-title" data-i18n="chat.createSessionTitle">Create New Conversation</h3>
            <button type="button" class="dialog-close-btn" id="closeCreateSessionBtn" aria-label="Close">
                <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </header>
        <form id="createSessionForm" class="dialog-form" novalidate>
            <div class="form-group">
                <label for="newSessionNameInput" class="form-label" data-i18n="chat.sessionNameLabel">Conversation Name</label>
                <input type="text" id="newSessionNameInput" class="form-input" 
                       data-i18n-placeholder="chat.sessionNamePlaceholder" 
                       placeholder="Enter conversation name..." required autocomplete="off">
            </div>
            <div class="dialog-actions">
                <button type="button" id="cancelCreateSessionBtn" class="btn-secondary" data-i18n="common.cancel">Cancel</button>
                <button type="submit" id="submitCreateSessionBtn" class="btn-primary" data-i18n="chat.createBtn">Create</button>
            </div>
        </form>
    </div>

    <!-- Settings Toast Dialog (Houses Language, Theme Mode, and Logout) -->
    <div id="settingsDialog" class="interactive-dialog" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="dialogSettingsTitle">
        <header class="dialog-header">
            <h3 id="dialogSettingsTitle" class="dialog-title" data-i18n="chat.settingsTitle">Settings</h3>
            <button type="button" class="dialog-close-btn" id="closeSettingsBtn" aria-label="Close">
                <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </header>
        <div class="dialog-body settings-dialog-body">
            <!-- Language Selection -->
            <div class="settings-row">
                <div class="settings-row-label">
                    <span data-i18n="common.language">Language</span>
                </div>
                <select id="languageSelect" class="select-control" aria-label="Language">
                    <!-- Populated dynamically by lang.js -->
                </select>
            </div>

            <!-- Dark / Light Mode Selection -->
            <div class="settings-row">
                <div class="settings-row-label">
                    <span data-i18n="chat.themeMode">Theme Mode</span>
                </div>
                <select id="themeModeSelect" class="select-control" aria-label="Theme Mode">
                    <!-- Populated dynamically by style.js -->
                </select>
            </div>

            <!-- Color Tone Accent Selection (Default Blue, Sakura Pink, Meadow Green) -->
            <div class="settings-row">
                <div class="settings-row-label">
                    <span data-i18n="chat.themeColor">Color Tone</span>
                </div>
                <select id="colorThemeSelect" class="select-control" aria-label="Color Tone">
                    <!-- Populated dynamically by style.js -->
                </select>
            </div>

            <!-- Logout Row -->
            <div class="settings-row settings-logout-row">
                <div class="settings-row-label">
                    <span data-i18n="chat.logoutBtn">Log Out</span>
                </div>
                <button type="button" id="dialogLogoutBtn" class="btn-danger btn-logout-action">
                    <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span data-i18n="chat.logoutBtn">Log Out</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts: Localization, Style Controller, Core API, Page Controller -->
    <script src="lang.js"></script>
    <script src="style.js"></script>
    <script src="core.js"></script>
    <script src="chat.js"></script>
</body>
</html>
